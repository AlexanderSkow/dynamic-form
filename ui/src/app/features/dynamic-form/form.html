@if (this.isUserPage()) {
  <h3> {{ userForm.value.firstName }}'s Page!</h3>
} @else {
  <h3>Create a User</h3>
}

<form [formGroup]="userForm" (ngSubmit)="saveUser()">
  <label for="first-name">First Name:</label>
  <input id="first-name" type="text" value="{{ userForm.get('firstName')?.value }}" formControlName="firstName" minlength="3">

  <label for="last-name">Last Name:</label>
  <input id="last-name" type="text" value="{{ userForm.get('lastName')?.value }}" formControlName="lastName" minlength="3">

  <label for="email">Email:</label>
  <input id="email" type="email" value="{{ userForm.get('email')?.value }}" formControlName="email">

  <div formArrayName="hobbies">
    @if (hobbies.length === 0) {
      <p>There are no hobbies...</p>
    }

    @for(hobby of hobbies.controls; track $index; let i = $index) {
      <div>
        <label for="hobby-{{ i }}">Hobby:</label>
        <input id="hobby-{{ i }}" type="text" value="{{ hobby.value }}" [formControlName]="i">
        <button type="button" (click)="removeHobby(i)">Remove Hobby</button>
      </div>
    }
    <button type="button" (click)="addHobby()">Add Hobby</button>
  </div>

  <button type="submit">Save</button>
  <button type="reset" (click)="resetForm()">{{ isUserPage() ? 'Clear User' : 'Reset' }}</button>

  @if (isUserPage()) {
    <button type="button" class="delete" (click)="deleteUser()">Delete</button>
  }
</form>
